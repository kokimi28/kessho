# main への push で test → build → gh-pages ブランチへ配信する。
# Pages のソースは gh-pages ブランチ（root）。GITHUB_TOKEN の contents:write のみで完結し、
# configure-pages の enablement（administration 権限が必要で integration token では不可）に依存しない。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# nightly と同じ group を共有して gh-pages への配信を直列化する。
# cancel-in-progress は false 固定: group は repo 全体で共有されるため true にすると、
# main への push が実行中の nightly を放送の途中で kill しうる（その夜の投稿が消える／
# 投稿済みなのに data/last-post.json を push できず翌夜が二重集計になる）。直列化だけで足りる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        run: node scripts/test.mjs
      - name: build
        env:
          # 計測ビーコン（docs/DESIGN.md §14）。HTML に出る公開値。Variables があれば優先、無ければ kessho.config.json の goatcounter_code
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: node scripts/build.mjs
      - name: publish to gh-pages
        run: |
          cp dist/index.html "$RUNNER_TEMP/index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          # -f 必須: GOATCOUNTER_CODE が設定されたビルドは追跡ファイル dist/index.html を書き換えるが、
          # gh-pages に dist/ は無いため、通常の checkout は "local changes would be overwritten" で
          # 中断し配信が丸ごと落ちる。配信物は直前に $RUNNER_TEMP へ退避済みなので破棄してよい。
          git checkout -f gh-pages
          cp "$RUNNER_TEMP/index.html" index.html
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "変化なし（配信済みと同一）"
          else
            git commit -m "deploy: update site"
            git push origin gh-pages
          fi
