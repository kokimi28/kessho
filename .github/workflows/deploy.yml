# main への push で test → build → gh-pages ブランチへ配信する。
# Pages のソースは gh-pages ブランチ（root）。GITHUB_TOKEN の contents:write のみで完結し、
# configure-pages の enablement（administration 権限が必要で integration token では不可）に依存しない。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        run: node scripts/test.mjs
      - name: build
        env:
          # 計測ビーコン（docs/DESIGN.md §14）。HTML に出る公開値なので Variables。未設定なら注入しない
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: node scripts/build.mjs
      - name: publish to gh-pages
        run: |
          cp dist/index.html "$RUNNER_TEMP/index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          cp "$RUNNER_TEMP/index.html" index.html
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "変化なし（配信済みと同一）"
          else
            git commit -m "deploy: update site"
            git push origin gh-pages
          fi
